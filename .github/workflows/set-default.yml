name: Set default branch to main (one-shot)

on:
  push:
    branches: [mirror]

permissions: {}

jobs:
  set-default:
    runs-on: ubuntu-latest
    steps:
      - name: PATCH repo default_branch
        run: |
          curl -sf -X PATCH \
            -H "Authorization: Bearer ${{ secrets.COMPANY_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}" \
            -d '{"default_branch":"main"}' \
            | grep -o '"default_branch": *"[^"]*"'
