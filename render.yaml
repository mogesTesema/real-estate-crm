# Render blueprint — single web service (free plan allows one service; no Redis/worker).
#
# The service is intentionally minimal during the architecture.md v3.2 rebuild: there is no
# API layer yet, so the health check targets /healthz/ rather than the API schema, and there
# is no seed command to run. Both come back with the API pass.
#
# DATABASE_URL must be the crm_app Neon URL, NOT neondb_owner. crm_app is deliberately a
# non-superuser role: superusers ignore the REVOKE UPDATE/DELETE that makes the append-only
# tables (finance_account_entry, platform_audit_event, collaboration_signature_event,
# crm_agent_location_point) actually immutable. See DEPLOY.md.
services:
  - type: web
    name: estatecrm-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /healthz/
    preDeployCommand: "python manage.py migrate --noinput && python manage.py collectstatic --noinput"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: PYTHONUNBUFFERED
        value: "1"
      # Set these two in the Render dashboard (marked sync:false = not stored in git):
      - key: DATABASE_URL # postgresql://crm_app:...@<neon-host>/neondb?sslmode=require
        sync: false
      - key: FRONTEND_ORIGIN # https://<your-app>.vercel.app
        sync: false
