[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = tests.py test_*.py *_tests.py
# --ds forces test settings even if DJANGO_SETTINGS_MODULE is set in the environment,
# so the suite always runs on the LOCAL Postgres and never the Neon DATABASE_URL.
addopts = -q --reuse-db --ds=config.settings.test
